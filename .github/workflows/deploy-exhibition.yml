name: Deploy Zistshahr English exhibition
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-exhibition.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zistshahr-production-ftp
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
      - name: Upload exhibition site to FTP root (mapped to /en)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ./
          state-name: .ftp-deploy-zistshahr-exhibition.json
          dangerous-clean-slate: false
      - name: Verify archive and live release
        shell: bash
        run: |
          set -euo pipefail
          for address in 'https://zistshahr.com/en/' 'https://zistshahr.com/en/t/01/' 'https://zistshahr.com/en/t/02/' 'https://zistshahr.com/en/t/03/' 'https://zistshahr.com/en/t/04/' 'https://zistshahr.com/en/t/05/' 'https://zistshahr.com/en/t/06/' 'https://zistshahr.com/en/t/07/' 'https://zistshahr.com/en/t/08/' 'https://zistshahr.com/en/t/09/' 'https://zistshahr.com/en/t/'; do
            echo "Check $address"
            curl --retry 4 --retry-delay 5 --max-time 40 --fail --silent --show-error --location "$address" -o /tmp/zistshahr-response.html
            grep -qi 'ZISTSHAHR' /tmp/zistshahr-response.html
            case "$address" in
              'https://zistshahr.com/en/'|'https://zistshahr.com/en/t/09/')
                grep -Fq 'Research Edition 09' /tmp/zistshahr-response.html
                grep -Fq 'id="release-style"' /tmp/zistshahr-response.html
                grep -Fq 'id="release-script"' /tmp/zistshahr-response.html
                grep -Fq 'id="donateDialog"' /tmp/zistshahr-response.html
                grep -Fq 'href="https://gofund.me/c3dfb9c46"' /tmp/zistshahr-response.html
                ;;
            esac
          done
          score_base='https://zistshahr.com/en/t/07/scores'
          curl --fail --silent --show-error --max-time 40 "$score_base/" -o /tmp/zistshahr-scores.html
          grep -Fq 'A City Rises' /tmp/zistshahr-scores.html
          for local_track in site/t/07/scores/*.mp3; do
            track="${local_track##*/}"
            curl --fail --silent --show-error --max-time 40 "$score_base/$track" -o /tmp/zistshahr-score.mp3
            cmp "$local_track" /tmp/zistshahr-score.mp3
          done
